name: Build Watch Anything (Windows; Mac and Android on request)

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    # "[mac only]" / "[android only]" in the commit message builds just that app.
    if: github.event_name != 'push' || !(contains(github.event.head_commit.message, '[mac only]') || contains(github.event.head_commit.message, '[android only]'))
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get libtorrent (torrent streaming)
        run: |
          python -m pip install libtorrent
          python -c "import libtorrent; print('libtorrent', libtorrent.__version__)"

      - name: Run the tests on Windows
        timeout-minutes: 20
        run: python -m tests.ci

      - name: Install build tools
        run: python -m pip install pyinstaller==6.22.1 pywebview==6.2 certifi

      - name: Get mpv (the built-in player)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "shinchiro/mpv-winbuild-cmake"
          $assets = gh release view --repo $repo --json assets --jq '.assets[].name'
          $name = $assets | Where-Object { $_ -match '^mpv-x86_64-\d{8}-git-[0-9a-f]+\.7z$' } | Select-Object -First 1
          if (-not $name) { $assets; throw "no Windows mpv build found in $repo" }
          Write-Host "Using $name"
          gh release download --repo $repo --pattern $name --dir mpv-dl
          7z x "mpv-dl/$name" -ompv-dl/x -y | Out-Null
          New-Item -ItemType Directory -Force packaging/mpv | Out-Null
          Copy-Item mpv-dl/x/mpv.exe packaging/mpv/
          Get-ChildItem packaging/mpv | Format-Table Name, Length

      - name: Get the player's controls (uosc)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo tomasklaen/uosc --pattern uosc.zip --dir uosc-dl
          7z x uosc-dl/uosc.zip -ouosc-dl/x -y | Out-Null
          New-Item -ItemType Directory -Force watchlist/mpv_config/scripts | Out-Null
          Copy-Item -Recurse uosc-dl/x/fonts watchlist/mpv_config/
          Copy-Item -Recurse uosc-dl/x/scripts/uosc watchlist/mpv_config/scripts/
          # Its helper programs (for downloading subtitles) aren't used: keeps the app small.
          Remove-Item -Recurse -Force watchlist/mpv_config/scripts/uosc/bin -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse watchlist/mpv_config | Measure-Object -Property Length -Sum | Format-List Count, Sum

      - name: Build Watch Anything.exe
        run: >
          pyinstaller main.py --noconfirm --onefile --windowed
          --name "Watch Anything"
          --hidden-import libtorrent --collect-binaries libtorrent
          --icon packaging/watchlist.ico
          --add-data "watchlist/web;watchlist/web"
          --add-data "watchlist/mpv_scripts;watchlist/mpv_scripts"
          --add-data "watchlist/mpv_config;watchlist/mpv_config"
          --add-binary "packaging/mpv/mpv.exe;mpv"

      - name: Check the exe has everything it needs
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "self-test.json"
          Start-Process -FilePath "dist\Watch Anything.exe" -ArgumentList "--self-test", $report -Wait
          $r = Get-Content $report | ConvertFrom-Json
          $r | Format-List
          if (-not $r.frozen) { throw "not running as a packaged exe" }
          if ($r.web_files -ne $true) { throw "the app's screens (HTML/JS/CSS) are missing from the exe" }
          if ($r.webview -ne $true) { throw "pywebview is missing: $($r.webview)" }
          if ($r.libtorrent -ne $true) { throw "libtorrent (torrent streaming) is missing: $($r.libtorrent)" }
          if ($r.clr -ne $true) { throw "pythonnet (needed for the app window) is missing: $($r.clr)" }
          if ($r.https -ne $true) { throw "secure (HTTPS) connections don't work: $($r.https)" }
          if ($r.player_ui -ne $true) { throw "the built-in player's controls (uosc) are missing from the exe" }

      - name: Check the built-in player plays and is followed
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "player-test.json"
          Start-Process -FilePath "dist\Watch Anything.exe" -ArgumentList "--player-test", $report -Wait
          $r = Get-Content $report | ConvertFrom-Json
          $r | Format-List
          if (-not $r.mpv) { throw "mpv isn't inside Watch Anything.exe" }
          if ($r.connected -ne $true) { throw "couldn't talk to mpv: $($r.error)" }
          if ($r.finished -ne $true) { throw "playing to the end wasn't noticed (last position $($r.last_position))" }
          if (-not ($r.skip_log -like "opening*")) { throw "the opening skipper didn't work: '$($r.skip_log)'" }
          if ($r.send_ok -ne $true -or $r.played_after_send -ne $true) { throw "commands sent to the player didn't work (watch parties need them)" }

      - name: Start the exe and load the app
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "watchlist-data"
          $p = Start-Process -FilePath "dist\Watch Anything.exe" -ArgumentList "--no-open", "--port", "8791", "--data", $data -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $ok = (Invoke-RestMethod "http://127.0.0.1:8791/api/ping").app -eq "watchlist" } catch {}
          }
          try {
            if (-not $ok) { throw "Watch Anything.exe didn't start its server" }
            foreach ($page in "/", "/app.js", "/style.css", "/icon.svg") {
              $res = Invoke-WebRequest "http://127.0.0.1:8791$page" -UseBasicParsing
              Write-Host "$page -> $($res.StatusCode), $($res.RawContentLength) bytes"
            }
            $state = Invoke-RestMethod "http://127.0.0.1:8791/api/state"
            Write-Host "VLC on this machine: '$($state.status.vlc)'"
          } finally {
            $p | Stop-Process -Force -ErrorAction SilentlyContinue
            Get-Process "Watch Anything" -ErrorAction SilentlyContinue | Stop-Process -Force
          }
          if (-not (Test-Path $data)) { throw "the data folder wasn't created" }

      - uses: actions/upload-artifact@v4
        with:
          name: WatchAnything-windows
          path: dist/Watch Anything.exe
          retention-days: 90

  mac:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mac]')
    runs-on: macos-latest
    env:
      APP: dist/Watch Anything.app
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get libtorrent (torrent streaming)
        run: |
          python -m pip install libtorrent
          python -c "import libtorrent; print('libtorrent', libtorrent.__version__)"

      - name: Run the tests on macOS
        timeout-minutes: 20
        run: python -m tests.ci

      - name: Install build tools
        run: python -m pip install pyinstaller==6.22.1 pywebview==6.2 certifi

      - name: Get mpv (the built-in player)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo=mpv-player/mpv
          name=""
          for tag in $(gh release list --repo $repo --limit 6 --json tagName --jq '.[].tagName'); do
            echo "== $tag"; gh release view "$tag" --repo $repo --json assets --jq '.assets[].name' | tee assets.txt
            name=$(grep -iE 'mac.*(arm|arm64|apple).*\.(zip|tar\.gz)$' assets.txt | head -1)
            if [ -n "$name" ]; then break; fi
          done
          if [ -z "$name" ]; then echo "no Apple Silicon mpv build found in $repo releases"; exit 1; fi
          echo "Using $tag / $name"
          gh release download "$tag" --repo $repo --pattern "$name" --dir mpv-dl
          cd mpv-dl
          case "$name" in *.zip) ditto -x -k "$name" x ;; *) mkdir x && tar -xzf "$name" -C x ;; esac
          # Some builds wrap the app in another archive.
          find x -name "*.tar.gz" -exec tar -xzf {} -C x \;
          find x -name "*.zip" -exec ditto -x -k {} x \;
          app=$(find x -name "mpv.app" -type d -prune | head -1)
          if [ -z "$app" ]; then find x -maxdepth 4; echo "no mpv.app inside $name"; exit 1; fi
          ditto "$app" ../packaging/mpv.app
          ls -la ../packaging/mpv.app/Contents/MacOS

      - name: Get the player's controls (uosc)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo tomasklaen/uosc --pattern uosc.zip --dir uosc-dl
          ditto -x -k uosc-dl/uosc.zip uosc-dl/x
          mkdir -p watchlist/mpv_config/scripts
          cp -R uosc-dl/x/fonts watchlist/mpv_config/
          cp -R uosc-dl/x/scripts/uosc watchlist/mpv_config/scripts/
          rm -rf watchlist/mpv_config/scripts/uosc/bin
          du -sh watchlist/mpv_config

      - name: Build Watch Anything.app
        run: |
          pyinstaller main.py --noconfirm --windowed \
            --name "Watch Anything" \
            --hidden-import libtorrent --collect-binaries libtorrent \
            --icon packaging/watchlist.icns \
            --osx-bundle-identifier app.watchanything.desktop \
            --add-data "watchlist/web:watchlist/web" \
            --add-data "watchlist/mpv_scripts:watchlist/mpv_scripts" \
            --add-data "watchlist/mpv_config:watchlist/mpv_config"
          # The built-in player goes inside the app, then the whole app is signed again.
          ditto packaging/mpv.app "$APP/Contents/Resources/mpv.app"
          # mpv's own app says it opens every kind of video, which lets macOS make it
          # the default player for videos. Inside Watch Anything it only plays what the app
          # asks it to, so those claims are removed before signing.
          plist="$APP/Contents/Resources/mpv.app/Contents/Info.plist"
          for key in CFBundleDocumentTypes CFBundleURLTypes UTExportedTypeDeclarations UTImportedTypeDeclarations NSServices; do
            /usr/libexec/PlistBuddy -c "Delete :$key" "$plist" 2>/dev/null || true
          done
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP" && echo "signature ok"

      - name: Check the app doesn't claim any kind of file
        run: |
          # Watch Anything must never become the default app for videos (or anything else).
          for p in "$APP/Contents/Info.plist" "$APP/Contents/Resources/mpv.app/Contents/Info.plist"; do
            for key in CFBundleDocumentTypes CFBundleURLTypes UTExportedTypeDeclarations; do
              if /usr/libexec/PlistBuddy -c "Print :$key" "$p" >/dev/null 2>&1; then
                echo "$p still has $key"; exit 1
              fi
            done
          done
          echo "no file types claimed"

      - name: Check the app has everything it needs
        run: |
          report="$RUNNER_TEMP/self-test.json"
          "$APP/Contents/MacOS/Watch Anything" --self-test "$report"
          cat "$report"; echo
          python3 - "$report" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          missing = {k: v for k, v in report.items() if v is not True}
          if missing:
              sys.exit(f"missing from Watch Anything.app: {missing}")
          PY

      - name: Check the built-in player plays and is followed
        run: |
          report="$RUNNER_TEMP/player-test.json"
          "$APP/Contents/MacOS/Watch Anything" --player-test "$report"
          cat "$report"; echo
          python3 - "$report" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          if not r.get("mpv"):
              sys.exit("mpv isn't inside Watch Anything.app")
          if r.get("connected") is not True:
              sys.exit(f"couldn't talk to mpv: {r.get('error')}")
          if r.get("finished") is not True:
              sys.exit(f"playing to the end wasn't noticed: {r}")
          if not r.get("skip_log", "").startswith("opening"):
              sys.exit(f"the opening skipper didn't work: {r}")
          if not (r.get("send_ok") and r.get("played_after_send")):
              sys.exit(f"commands sent to the player didn't work (watch parties need them): {r}")
          PY

      - name: Start the app and load it
        run: |
          "$APP/Contents/MacOS/Watch Anything" --no-open --port 8791 --data "$RUNNER_TEMP/watchlist-data" &
          pid=$!
          for i in $(seq 60); do curl -sf http://127.0.0.1:8791/api/ping && break; sleep 1; done
          echo
          for page in / /app.js /style.css /icon.svg; do
            curl -sf -o /dev/null -w "$page -> %{http_code}, %{size_download} bytes\n" "http://127.0.0.1:8791$page"
          done
          curl -sf http://127.0.0.1:8791/api/state | python3 -c "import json,sys; print('VLC on this Mac:', repr(json.load(sys.stdin)['status']['vlc']))"
          kill $pid
          test -d "$RUNNER_TEMP/watchlist-data"

      - name: Make Watch Anything.dmg
        run: |
          mkdir dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          for attempt in 1 2 3; do
            hdiutil create -volname "Watch Anything" -srcfolder dmg -ov -format UDZO WatchAnything.dmg && break
            sleep 5
          done
          test -f WatchAnything.dmg
          ls -lh WatchAnything.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: WatchAnything-mac
          path: WatchAnything.dmg
          retention-days: 90

  android:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android]')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the tests
        timeout-minutes: 20
        run: |
          python -m pip install libtorrent
          python -m tests.ci -q

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Put the app's code into the phone app
        run: |
          mkdir -p android/app/src/main/python
          cp -r watchlist android/app/src/main/python/
          # (the computer player's files aren't used on a phone)
          rm -rf android/app/src/main/python/watchlist/mpv_config android/app/src/main/python/watchlist/mpv_scripts
          find android/app/src/main/python -name __pycache__ -prune -exec rm -rf {} +

      - name: Build the APK
        run: |
          gradle -p android assembleDebug --stacktrace
          cp android/app/build/outputs/apk/debug/app-debug.apk WatchAnything.apk
          ls -lh WatchAnything.apk

      - name: Let the emulator use the CPU's virtualisation
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the APK on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          script: bash android/smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshots
          path: android-*.png
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: WatchAnything-android
          path: WatchAnything.apk
          retention-days: 90
