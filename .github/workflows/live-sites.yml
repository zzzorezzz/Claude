name: Live sites (recommended sites, 5 seconds of three titles each)

# Run by hand: it uses the internet (the sites themselves), so it isn't part of every build.
on:
  # By hand, or with "[live]" in a commit message (a branch's workflows can't be started by hand).
  push:
    branches: ["claude/**"]
  workflow_dispatch:
    inputs:
      sites:
        description: "Only these sites (names, space-separated; empty: all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  mac:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[live')
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The player (mpv) and the app's own Python packages
        run: |
          brew install mpv
          python -m pip install certifi yt-dlp curl_cffi
          which mpv && mpv --version | head -1

      - name: The video finder's Chromium, fetched as the app does on a Mac without Chrome
        run: |
          python -c "from pathlib import Path; from watchlist import cdp; cdp.HOME = Path('chromium-home'); print(cdp.download())"

      - name: Diagnosis of a site's chunks ([diag] in the commit message)
        if: contains(github.event.head_commit.message, '[diag]')
        run: python -c "from pathlib import Path; from watchlist import cdp; cdp.HOME = Path('chromium-home'); from tests import diag_hls; diag_hls.main()"

      - name: Every recommended site, three titles each, played for 5 seconds
        if: "!contains(github.event.head_commit.message, '[diag]')"
        env:
          WATCHLIST_CHROMIUM_HOME: chromium-home
          SITES: ${{ github.event.inputs.sites }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import os, re, sys
          from pathlib import Path
          from watchlist import cdp
          cdp.HOME = Path("chromium-home")
          print("video finder:", cdp.find())
          from tests import live_sites
          # (sites by hand, or "[live: Name Name]" in the commit message)
          named = re.search(r"\[live:([^\]]*)\]", os.environ.get("MESSAGE") or "")
          sites = (os.environ.get("SITES") or (named.group(1) if named else "")).split()
          sys.exit(live_sites.main(["live-report.json", *sites]))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-sites-mac
          path: live-report.json
