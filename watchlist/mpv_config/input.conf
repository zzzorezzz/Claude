# The built-in player's menu (right-click, or the menu button): uosc builds it from the
# "#!" names below. A line whose key is "#" is a menu item without a key of its own.
mbtn_right  script-binding uosc/menu
menu        script-binding uosc/menu
#           script-binding uosc/subtitles                  #! Subtitles
v           cycle sub-visibility                           #! Subtitles on / off
#           script-binding uosc/audio                      #! Audio (sub / dub)
#           script-binding uosc/stream-quality             #! Quality
F8          script-binding uosc/items                      #! Episodes
>           script-binding uosc/next                       #! Next episode
<           script-binding uosc/prev                       #! Previous episode
ctrl+i      script-message-to watchlist_skip show-source   #! Where this is playing from
[           add speed -0.25                                #! Settings > Speed > Slower
]           add speed 0.25                                 #! Settings > Speed > Faster
BS          set speed 1                                    #! Settings > Speed > Normal speed
#           cycle-values speed 1.25 1.5 2 1                #! Settings > Speed > 1.25× / 1.5× / 2×
f           cycle fullscreen                               #! Fullscreen
