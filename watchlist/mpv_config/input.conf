# The built-in player's menu (right-click, or the menu button): uosc builds it from the
# names after the hash-and-bang below; a line whose key is a hash is an item without a key.
# (uosc reads every line with a hash-and-bang in it - even in a comment - as a menu item.)
mbtn_right  script-binding uosc/menu
menu        script-binding uosc/menu
#           script-binding uosc/subtitles                  #! Subtitles
v           cycle sub-visibility                           #! Subtitles on / off
#           script-message-to watchlist_skip switch-version #! Switch sub / dub
#           script-binding uosc/audio                      #! Audio tracks
#           script-message-to watchlist_skip load-subtitle #! Add a subtitle file…
alt+s       script-message-to watchlist_skip ai-subs       #! Make subtitles with AI
F8          script-binding uosc/items                      #! Episodes
>           script-message-to watchlist_skip next          #! Next episode
<           script-message-to watchlist_skip prev          #! Previous episode
ctrl+i      script-message-to watchlist_skip show-source   #! Where this is playing from
s           script-message-to watchlist_skip servers       #! Servers…
ctrl+f      script-message-to watchlist_skip other-site    #! Find it on another site
[           add speed -0.25                                #! Settings > Speed > Slower
]           add speed 0.25                                 #! Settings > Speed > Faster
BS          set speed 1                                    #! Settings > Speed > Normal speed
#           cycle-values speed 1.25 1.5 2 1                #! Settings > Speed > 1.25× / 1.5× / 2×
f           cycle fullscreen                               #! Fullscreen
?           script-message-to watchlist_skip shortcuts     #! Keyboard shortcuts
F1          script-message-to watchlist_skip shortcuts
ENTER       script-message-to watchlist_skip next

# Left / Right go back and on; Up / Down (and the mouse wheel) are the volume.
LEFT        seek -5
RIGHT       seek 5
UP          add volume 5
DOWN        add volume -5
WHEEL_UP    add volume 5
WHEEL_DOWN  add volume -5
# Audio and subtitles a little earlier or later (shown as they change): - and = for the
# sound, z and x for the subtitles, 0.1 s each press.
-           add audio-delay -0.100
=           add audio-delay 0.100
z           add sub-delay -0.100
x           add sub-delay 0.100
