# The built-in player's controls (uosc), in Watch Anything's colours.
# uosc itself is fetched when the app is built (see .github/workflows/build-exe.yml).
timeline_style=bar
timeline_size=34
timeline_border=0
progress=windowed
progress_size=3
controls=play-pause,command:skip_previous:script-message-to watchlist_skip prev?Previous episode,command:skip_next:script-message-to watchlist_skip next?Next episode,gap,subtitles,<has_sub>cycle:subtitles:sub-visibility:no=subtitles_off/yes=subtitles!?Subtitles on/off,<has_audio>audio,<has_chapter>chapters,<has_many_edition>editions,gap,space,command:closed_caption:script-message-to watchlist_skip load-subtitle?Add a subtitle file,command:translate:script-message-to watchlist_skip switch-version?Sub / Dub,command:link:script-message-to watchlist_skip show-source?Where this is playing from,items,gap,fullscreen
controls_size=34
controls_margin=10
volume=right
volume_size=36
top_bar=no-border
top_bar_controls=right
top_bar_title=yes
border_radius=8
animation_duration=140
font_bold=no
text_border=0.8
proximity_in=50
proximity_out=140
destination_time=playtime-remaining
pause_indicator=flash
buffered_time_threshold=30
autoload=no
color=foreground=7c5cff,foreground_text=ffffff,background=0d0f1a,background_text=e6e9f2,curtain=0d0f1a,success=4ade80,error=ff6b81,match=22d3ee,heatmap=22d3ee
opacity=timeline=0.85,position=1,chapters=0.7,slider=0.9,controls=0,menu=0.97,curtain=0.75,title=1,tooltip=0.97
chapter_ranges=openings:22d3ee55,endings:22d3ee55,ads:ff6b8166
# Hide the controls when mpv hides the mouse pointer (after 5 seconds without moving it, see
# --cursor-autohide), even when the pointer rests over the volume or the timeline.
autohide=yes
