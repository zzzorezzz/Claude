<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Watch Anything</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="nav" class="nav">
    <div class="nav-left">
      <a class="logo" href="#/"><img class="logo-img" src="/logo.png" alt="" width="40" height="40"><span class="logo-text">Watch Anything</span></a>
      <nav class="nav-links">
        <a href="#/" data-route="home">Home</a>
        <a href="#/tv" data-route="tv">TV Shows</a>
        <a href="#/anime" data-route="anime">Anime</a>
        <a href="#/movie" data-route="movie">Movies</a>
        <a href="#/collections" data-route="collections">Collections</a>
        <a href="#/watched" data-route="watched">Watched</a>
        <a href="#/find" data-route="find" class="nav-find">Find Media</a>
      </nav>
      <div class="dropdown nav-more">
        <button id="btn-browse" class="nav-btn" type="button" aria-haspopup="menu"><span id="browse-label">Browse</span> <span class="caret">▾</span></button>
        <div id="browse-menu" class="menu hidden" role="menu"></div>
      </div>
    </div>
    <div class="nav-right">
      <label class="search" title="Search your list">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3a7 7 0 1 0 4.2 12.6l5.1 5.1 1.4-1.4-5.1-5.1A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg>
        <input id="search" type="search" placeholder="Titles, genres, people" autocomplete="off" spellcheck="false">
      </label>
      <div class="dropdown">
        <button id="btn-year" class="nav-btn" type="button" title="Sort">Popular <span class="caret">▾</span></button>
        <div id="sort-menu" class="menu hidden" role="menu"></div>
      </div>
      <div class="dropdown">
        <button id="btn-genre" class="nav-btn" type="button">Genre <span class="caret">▾</span></button>
        <div id="genre-menu" class="menu hidden" role="menu"></div>
      </div>
      <button id="btn-surprise" class="icon-btn" type="button" title="Surprise me - pick something to watch" aria-label="Surprise me">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zm2.5 3a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM12 10.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM7.5 15a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>
      </button>
      <button id="btn-torrents" class="icon-btn hidden" type="button" title="Torrents" aria-label="Torrents">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M11 3h2v9.6l3.3-3.3 1.4 1.4L12 16.4l-5.7-5.7 1.4-1.4 3.3 3.3zM4 18h16v2H4z"/></svg>
      </button>
      <button id="btn-party" class="icon-btn" type="button" title="Watch together" aria-label="Watch together">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm7.5-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM9 13c-3.3 0-7 1.6-7 4v3h14v-3c0-2.4-3.7-4-7-4zm7.5-1c-.5 0-1 0-1.6.1 1.3.9 2.1 2.2 2.1 3.9v3h5v-2.6c0-2.3-3.2-4.4-5.5-4.4z"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" type="button" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.47.47 0 0 0-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 0 0-.59.22L2.74 8.87a.47.47 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.61zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
      </button>
    </div>
  </header>

  <main id="view"></main>

  <!-- On a phone: the sections, at the bottom, under your thumb. -->
  <nav id="tabbar" class="tabbar" aria-label="Sections">
    <a href="#/" data-route="home"><svg viewBox="0 0 24 24"><path d="M12 3 3 10.5V21h6v-6h6v6h6V10.5z"/></svg><span>Home</span></a>
    <a href="#/tv" data-route="tv"><svg viewBox="0 0 24 24"><path d="M21 6h-7.6l3.3-3.3-.7-.7L12 6 8 2l-.7.7L10.6 6H3a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 13H3V8h18z"/></svg><span>TV</span></a>
    <a href="#/anime" data-route="anime"><svg viewBox="0 0 24 24"><path d="M12 2 9.2 8.6 2 9.2l5.5 4.8L5.8 21 12 17.3 18.2 21l-1.7-7L22 9.2l-7.2-.6z"/></svg><span>Anime</span></a>
    <a href="#/movie" data-route="movie"><svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V4z"/></svg><span>Movies</span></a>
    <a href="#/find" data-route="find"><svg viewBox="0 0 24 24"><path d="M10 3a7 7 0 1 0 4.2 12.6l5.1 5.1 1.4-1.4-5.1-5.1A7 7 0 0 0 10 3zm0 2a5 5 0 1 1 0 10 5 5 0 0 1 0-10z"/></svg><span>Find</span></a>
    <a href="#/collections" data-route="collections"><svg viewBox="0 0 24 24"><path d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H8V4h12z"/></svg><span>Lists</span></a>
  </nav>

  <div id="modal-root"></div>
  <div id="menu-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
